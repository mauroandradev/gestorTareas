<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-4" y="-2" width="72" height="72" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Calendar Base Shadow & Body -->
  <rect x="6" y="10" width="52" height="48" rx="12" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Calendar Header / Top Banner -->
  <path d="M6 22C6 15.3726 11.3726 10 18 10H46C52.6274 10 58 15.3726 58 22V24H6V22Z" fill="url(#headerGrad)" />

  <!-- Spiral Binder Rings -->
  <rect x="16" y="5" width="4" height="10" rx="2" fill="#0f172a" />
  <rect x="17" y="6" width="2" height="8" rx="1" fill="#94a3b8" />
  
  <rect x="44" y="5" width="4" height="10" rx="2" fill="#0f172a" />
  <rect x="45" y="6" width="2" height="8" rx="1" fill="#94a3b8" />

  <!-- Calendar Grid Elements (High contrast, modern) -->
  <!-- Row 1 -->
  <rect x="14" y="30" width="6" height="6" rx="2" fill="#94a3b8" />
  <rect x="24" y="30" width="6" height="6" rx="2" fill="#94a3b8" />
  <rect x="34" y="30" width="6" height="6" rx="2" fill="#94a3b8" />
  <rect x="44" y="30" width="6" height="6" rx="2" fill="#4f46e5" />

  <!-- Row 2 -->
  <rect x="14" y="40" width="6" height="6" rx="2" fill="#94a3b8" />
  <rect x="24" y="40" width="6" height="6" rx="2" fill="#6366f1" />
  <rect x="34" y="40" width="6" height="6" rx="2" fill="#94a3b8" />
  <rect x="44" y="40" width="6" height="6" rx="2" fill="#06b6d4" />

  <!-- Highlight Indicator Dot on Top Right -->
  <circle cx="50" cy="17" r="2.5" fill="#38bdf8" />
</svg>
